services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./diario-de-hogwarts-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: hogwarts_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD no arquivo .env}
      DB_NAME: diario_hogwarts
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: diario_hogwarts
      SESSION_KEY: ${SESSION_KEY:?Defina SESSION_KEY no arquivo .env}
    ports:
      - "3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: diario_hogwarts
      MYSQL_USER: hogwarts_app
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD no arquivo .env}
    volumes:
      - mysql_data_app:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongodb:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data_app:
  mongo_data: